    <!-- Flash-free theme initialization: runs synchronously before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('agency-theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <meta name="google-site-verification" content="MggqYnWaSbHoMWBUQxjIBBoSJRvpTj6jORlqmmQ-aCQ" />
  </head>

  </body>
